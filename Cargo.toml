[workspace]
members = [
    "crates/straw-core",
    "crates/straw-db",
    "crates/straw-icon",
    "crates/straw-patcher",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
csv = "1"
encoding_rs = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
